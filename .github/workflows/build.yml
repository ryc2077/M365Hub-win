name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  # The real-account test posts the short-lived PKCE auth URL to an issue
  # so the operator can read it instantly (job logs lag too far behind);
  # the issue is closed by the test script when it finishes.
  issues: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Core library tests: the same checks as the Android host tests
      # (Markdown, TeXSplit, MathSegments, TeX layout geometry, and the
      # radical as one connected polyline).
      - name: Core tests
        run: dotnet run --project tests/M365Hub.Tests -c Release

      # WinUI 3 resource packaging (the PriGen step) needs Visual
      # Studio's MSBuild: the Pri tasks DLL ships with Visual Studio,
      # not with the .NET SDK, so `dotnet build` fails with MSB4062
      # ("ExpandPriContent task could not be loaded") on a plain SDK
      # install. Use the VS MSBuild that setup-msbuild puts on PATH.
      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Restore WinUI app
        run: dotnet restore src/M365Hub.App/M365Hub.App.csproj

      - name: Build WinUI app (x64)
        run: msbuild src/M365Hub.App/M365Hub.App.csproj -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build WinUI app (ARM64)
        run: msbuild src/M365Hub.App/M365Hub.App.csproj -p:Configuration=Release -p:Platform=ARM64 -p:RuntimeIdentifier=win-arm64

      # 1.0.6: the app self-bootstraps and falls back to a bundled 1.6
      # installer (see RuntimeBootstrap.cs), so the release zip must
      # carry Microsoft's official installer next to each arch's exe.
      # Both URLs are the aka.ms links from Microsoft Learn's Windows App
      # SDK downloads page; verify the signature so a bad download fails
      # the build instead of shipping a broken installer.
      - name: Bundle Windows App Runtime installer
        shell: powershell
        run: |
          $x64Out = "src/M365Hub.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
          $armOut = "src/M365Hub.App/bin/ARM64/Release/net8.0-windows10.0.19041.0/win-arm64"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe" -OutFile "$env:RUNNER_TEMP\war-x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-arm64.exe" -OutFile "$env:RUNNER_TEMP\war-arm64.exe"
          New-Item -ItemType Directory -Force "$x64Out/runtime" | Out-Null
          New-Item -ItemType Directory -Force "$armOut/runtime" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\war-x64.exe" "$x64Out/runtime/WindowsAppRuntimeInstall.exe"
          Copy-Item "$env:RUNNER_TEMP\war-arm64.exe" "$armOut/runtime/WindowsAppRuntimeInstall.exe"
          foreach ($f in @("$x64Out/runtime/WindowsAppRuntimeInstall.exe", "$armOut/runtime/WindowsAppRuntimeInstall.exe")) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f
            Write-Host "$f : $((Get-Item $f).Length) bytes, signature $($sig.Status), signer $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
              throw "bundled installer signature check failed: $f"
            }
          }
          Write-Host "BUNDLED-INSTALLER: PASS"

      # 1.0.6 clean-environment proof: this runner image does NOT
      # preinstall the Windows App Runtime (the "Install if missing"
      # step below finds it missing on a fresh runner), so launch the
      # app here — before anything installs the runtime — and prove it
      # comes up by installing its bundled installer on its own. No
      # preinstalled runtime, no framework install dialog. The app must
      # reach the login page (gateway answers) and the runtime must be
      # present again afterwards, which proves the fallback actually
      # installed it. If the runner already has 1.6, fail loudly instead
      # of claiming a clean test that never was.
      # (First attempt tried uninstalling the runtime after the normal
      # launch test; Remove-AppxPackage silently left 6000.519.329.0
      # behind, so the uninstall approach cannot prove anything here.)
      - name: Clean-environment launch test (no runtime preinstalled)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          $exe = "src/M365Hub.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/M365Hub.App.exe"
          $installer = "src/M365Hub.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/runtime/WindowsAppRuntimeInstall.exe"
          $armInstaller = "src/M365Hub.App/bin/ARM64/Release/net8.0-windows10.0.19041.0/win-arm64/runtime/WindowsAppRuntimeInstall.exe"
          if (-not (Test-Path $installer)) { throw "bundled installer missing: $installer" }
          if (-not (Test-Path $armInstaller)) { throw "bundled installer missing: $armInstaller" }
          Write-Host "bundled installers present: $((Get-Item $installer).Length) bytes x64, $((Get-Item $armInstaller).Length) bytes arm64"
          $pre = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.6" -AllUsers | Select-Object -First 1
          if ($pre) { throw "CLEAN-LAUNCH-TEST: FAIL - runner already has runtime 1.6 ($($pre.Version)); clean proof impossible on this image" }
          Write-Host "no runtime 1.6 on this runner; launching app with no runtime installed"
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA/M365Hub" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Write-Host "app pid: $($p.Id)"
          $up = $false
          for ($i = 1; $i -le 120; $i++) {
            $code = curl.exe -s -o NUL -w "%{http_code}" -m 2 http://127.0.0.1:8230/api/admin/session
            if ($code -ne "000" -and $code -ne "") { $up = $true; break }
            if ($i % 15 -eq 0) { Write-Host "attempt ${i}: http=$code" }
            Start-Sleep -Seconds 1
          }
          Write-Host "gateway up: $up"
          Start-Sleep -Seconds 5
          $p.Refresh()
          Write-Host "app process alive: $(-not $p.HasExited), exit code: $($p.ExitCode)"
          $rt = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.6" -AllUsers | Select-Object -First 1
          Write-Host "runtime 1.6 present again (bundled installer ran): $($rt.Version)"
          Get-Content "$env:LOCALAPPDATA/M365Hub/runtime-bootstrap.log" -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("test-evidence/app-launch-clean.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "screenshot saved: test-evidence/app-launch-clean.png ($($bounds.Width)x$($bounds.Height))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process m365hub -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $up) { throw "CLEAN-LAUNCH-TEST: FAIL - app gateway never answered without preinstalled runtime" }
          if (-not $rt) { throw "CLEAN-LAUNCH-TEST: FAIL - runtime 1.6 not installed after app launch (bundled installer did not run)" }
          Write-Host "CLEAN-LAUNCH-TEST: PASS"


      # Gateway cold start, through the exact binary the app ships.
      - name: Gateway cold-start test
        shell: bash
        run: bash scripts/test-gateway-win.sh

      # The unpackaged WinUI app needs the Windows App Runtime
      # framework package on the machine; a clean runner may not have
      # it, and then the app shows a "requires the Windows App Runtime"
      # dialog (or dies) instead of starting its gateway. Install it
      # when it is missing.
      - name: Install Windows App Runtime if missing
        shell: powershell
        run: |
          $pkg = Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.6" -AllUsers
          if ($pkg) {
            Write-Host "Windows App Runtime already installed: $($pkg.Version)"
          } else {
            Write-Host "Windows App Runtime missing, installing..."
            Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.6/latest/windowsappruntimeinstall-x64.exe" -OutFile "$env:RUNNER_TEMP\war-install.exe"
            Start-Process -FilePath "$env:RUNNER_TEMP\war-install.exe" -ArgumentList "--quiet" -Wait
            Get-AppxPackage -Name "Microsoft.WindowsAppRuntime.1.6" -AllUsers | Select-Object Name, Version
          }

      # Launch the built WinUI app and prove its gateway comes up, the
      # way the Mac CI does with the app launch test. Diagnostics on
      # failure: whether the app process is still alive and its exit
      # code, the gateway log, and a screenshot of the desktop (a
      # "requires the Windows App Runtime" dialog shows up there).
      - name: App launch test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          $exe = "src/M365Hub.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/M365Hub.App.exe"
          if (-not (Test-Path $exe)) { throw "app exe not found: $exe" }
          Write-Host "Windows App Runtime: $((Get-AppxPackage -Name 'Microsoft.WindowsAppRuntime.1.6' -AllUsers | Select-Object -First 1).Version)"
          Write-Host "gateway exe next to the app: $(Test-Path (Join-Path (Split-Path $exe) 'm365hub.exe'))"
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA/M365Hub" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Write-Host "app pid: $($p.Id)"
          $up = $false
          for ($i = 1; $i -le 30; $i++) {
            $code = curl.exe -s -o NUL -w "%{http_code}" -m 2 http://127.0.0.1:8230/api/admin/session
            Write-Host "attempt ${i}: http=$code"
            if ($code -ne "000" -and $code -ne "") { $up = $true; break }
            Start-Sleep -Seconds 1
          }
          Write-Host "gateway up: $up"
          # The app flips to the login page a couple of seconds after
          # the gateway answers; wait so the screenshot shows the login
          # page, not the "starting gateway" screen.
          Start-Sleep -Seconds 5
          $p.Refresh()
          Write-Host "app process alive: $(-not $p.HasExited), exit code: $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA/M365Hub/serve-windows.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("test-evidence/app-launch.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host "screenshot saved: test-evidence/app-launch.png ($($bounds.Width)x$($bounds.Height))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process m365hub -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $up) { throw "APP-LAUNCH-TEST: FAIL - app gateway never answered" }
          Write-Host "APP-LAUNCH-TEST: PASS"

      # Account-add + chat, through the exact endpoints the WinUI app
      # calls: admin login (forced password change), accounts list,
      # PKCE/device start, bogus callback rejection, and chat with zero
      # accounts. Completing the Microsoft sign-in needs a human in the
      # browser, so this proves the flows start and fail cleanly; it
      # cannot mint an account by itself.
      - name: Account add and chat test
        shell: bash
        run: bash scripts/test-account-chat-win.sh

      # Real-account test via PKCE: add a Microsoft 365 account through
      # the browser PKCE flow and send one real chat message. PKCE uses
      # the Office web Copilot client, not the FOCI "Microsoft Office"
      # client the device-code flow uses, so a Conditional Access policy
      # that blocks the latter may still allow this. The operator signs
      # in with the auth URL from the issue and posts the callback URL
      # back as a comment; the script polls for it (see the script).
      # No account credential is stored in the repo or the workflow.
      # The auth URL goes out through an issue (see the script), so pass
      # the token explicitly: $GITHUB_TOKEN is not set in run steps on
      # its own.
      - name: Real account test (PKCE)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/test-real-account-pkce-win.sh

      # CodeX tool-call test: install the Codex CLI on the runner,
      # point it at the gateway the PKCE step left running (same
      # account), and prove real tool calling: codex exec creates a
      # file, then appends a line and cats it. Both file contents are
      # verified on disk, so a model merely claiming it did the work
      # fails. The PKCE step hands the gateway off via a PID file; this
      # script stops the gateway when it is done.
      - name: CodeX tool-call test
        shell: bash
        run: bash scripts/test-codex-win.sh

      # Crash diagnostics: the app-crash.log the app writes on an
      # unhandled exception, plus the .NET Runtime / Application Error
      # entries (event IDs 1026/1000) from the Application event log,
      # which carry the exception message and stack trace.
      - name: Collect crash diagnostics
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          Copy-Item "$env:LOCALAPPDATA/M365Hub/app-crash.log" test-evidence/app-crash.log -ErrorAction SilentlyContinue
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Id -eq 1000 -or $_.Id -eq 1026 } |
            Select-Object -First 5 TimeCreated, Id, ProviderName, Message |
            Format-List | Out-File -FilePath test-evidence/eventlog.txt -Encoding utf8
          Get-Content test-evidence/eventlog.txt -ErrorAction SilentlyContinue | Select-Object -First 80

      - name: Collect test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p test-evidence
          cp "${RUNNER_TEMP}/m365hub-gateway-test/serve-test.log" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-account-chat-win-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-real-account-pkce-win-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/m365hub-codex-win-summary.txt" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex1.log" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex2.log" test-evidence/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/codex-win-test/hello.txt" test-evidence/codex-hello.txt 2>/dev/null || true
          cp "$LOCALAPPDATA/M365Hub/serve-windows.log" test-evidence/serve-windows-app.log 2>/dev/null || true
          ls -la test-evidence/

      - name: Upload Windows app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M365Hub-windows
          path: |
            src/M365Hub.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
            src/M365Hub.App/bin/ARM64/Release/net8.0-windows10.0.19041.0/win-arm64/
            test-evidence/
